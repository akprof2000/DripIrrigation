<svg viewBox="0 0 1540 800" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#607D8B"/></marker></defs>
<rect width="1540" height="800" fill="#FFFFFF"/>
<text x="40" y="44" font-size="24" font-weight="bold" fill="#263238">Из чего собирается контроллер</text>
<text x="40" y="68" font-size="13" fill="#78909C">Плата-носитель связывает покупные модули дорожками. Оранжевое — реле, бирюзовое — датчики, розовое — питание.</text>
<rect x="380" y="100" width="760" height="590" rx="14" fill="#F1F8E9" stroke="#2E7D32" stroke-width="3"/>
<text x="760" y="126" font-size="15" fill="#1B5E20" text-anchor="middle" font-weight="bold">ПЛАТА-НОСИТЕЛЬ 150×110 мм</text>
<text x="760" y="146" font-size="12" fill="#33691E" text-anchor="middle">модули вставляются в гнёзда; паяются только гнёзда, клеммники и мелочь</text>
<rect x="400" y="162" width="146" height="57" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2"/>
<text x="473" y="187" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">ESP32 DevKitC</text>
<text x="473" y="209" font-size="11" fill="#455A64" text-anchor="middle">гнездо 2×19</text>
<rect x="556" y="162" width="100" height="57" rx="8" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
<text x="606" y="187" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">PCF8574P</text>
<text x="606" y="209" font-size="11" fill="#455A64" text-anchor="middle">DIP-16</text>
<rect x="667" y="162" width="100" height="57" rx="8" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
<text x="717" y="187" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">74HC4051</text>
<text x="717" y="209" font-size="11" fill="#455A64" text-anchor="middle">DIP-16</text>
<rect x="777" y="162" width="105" height="57" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2"/>
<text x="830" y="187" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">DS3231</text>
<text x="830" y="209" font-size="11" fill="#455A64" text-anchor="middle">гнездо 1×6</text>
<rect x="892" y="162" width="105" height="57" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2"/>
