<rect x="40" y="720" width="1120" height="98" rx="8" fill="#FFFDE7" stroke="#F9A825" stroke-width="2"/>
<text x="56" y="744" font-size="13" fill="#5D4037" text-anchor="start" font-weight="bold">Как ничего не отваливается</text>
<text x="56" y="766" font-size="12" fill="#5D4037" text-anchor="start">• модули — в гнёздах, релейные модули и плата — на стойках М3, сверху прижаты крышкой;</text>
<text x="56" y="786" font-size="12" fill="#5D4037" text-anchor="start">• внешние провода — через гермовводы (фиксируют кабель), концы обжаты наконечниками НШВИ и зажаты винтом клеммника;</text>
<text x="56" y="806" font-size="12" fill="#5D4037" text-anchor="start">• между платой и реле — провода в винтовых клеммах с обеих сторон, между платой и реле никаких Dupont.</text>
