<text x="945" y="209" font-size="11" fill="#455A64" text-anchor="middle">гнездо 2×8</text>
<rect x="400" y="242" width="137" height="57" rx="8" fill="#FCE4EC" stroke="#D81B60" stroke-width="2"/>
