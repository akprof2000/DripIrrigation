<text x="143" y="394" font-size="11" fill="#455A64" text-anchor="middle">перемычки в положении L</text>
<rect x="40" y="440" width="242" height="74" rx="8" fill="#FFF3E0" stroke="#FB8C00" stroke-width="2"/>
<text x="161" y="466" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">Реле 1 + 2 кан. 5 В, H/L</text>
<text x="161" y="488" font-size="11" fill="#455A64" text-anchor="middle">насос · налив · дренаж</text>
<text x="161" y="504" font-size="11" fill="#455A64" text-anchor="middle">перемычки в положении H</text>
<path d="M696 442 L688 442 L688 495 L290 495 L290 367 L247 367" fill="none" stroke="#FB8C00" stroke-width="3"/>
<path d="M290 495 L290 477 L282 477" fill="none" stroke="#FB8C00" stroke-width="3"/>
<text x="161" y="530" font-size="11" fill="#E65100" text-anchor="middle">провода к клеммам реле</text>
<rect x="1140" y="120" width="207" height="58" rx="8" fill="#E0F7FA" stroke="#00838F" stroke-width="2"/>
<text x="1243" y="146" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">Датчики влажности ×8</text>
<text x="1243" y="168" font-size="11" fill="#455A64" text-anchor="middle">ёмкостные v2.0, 3 провода</text>
<rect x="1140" y="210" width="259" height="74" rx="8" fill="#E0F7FA" stroke="#00838F" stroke-width="2"/>
<text x="1269" y="236" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">Дождь · Свет</text>
<text x="1269" y="258" font-size="11" fill="#455A64" text-anchor="middle">дождь — сухой контакт, как кнопка</text>
<text x="1269" y="274" font-size="11" fill="#455A64" text-anchor="middle">свет — выносной фоторезистор</text>
<rect x="1140" y="300" width="190" height="58" rx="8" fill="#E0F7FA" stroke="#00838F" stroke-width="2"/>
<text x="1235" y="326" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">Расходомер YF-S201</text>
<text x="1235" y="348" font-size="11" fill="#455A64" text-anchor="middle">5 В; делитель на плате</text>
<rect x="1140" y="420" width="177" height="74" rx="8" fill="#F3E5F5" stroke="#8E24AA" stroke-width="2"/>
<text x="1228" y="446" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">Клапаны 12 В ×8</text>
<text x="1228" y="468" font-size="11" fill="#455A64" text-anchor="middle">на контакты релейного</text>
<text x="1228" y="484" font-size="11" fill="#455A64" text-anchor="middle">модуля, не на плату</text>
<rect x="1140" y="530" width="184" height="58" rx="8" fill="#F3E5F5" stroke="#8E24AA" stroke-width="2"/>
