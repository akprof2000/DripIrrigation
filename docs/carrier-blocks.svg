<svg viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#607D8B"/></marker></defs>
<rect width="1400" height="760" fill="#FFFFFF"/>
<text x="40" y="44" font-size="24" font-weight="bold" fill="#263238">Из чего собирается контроллер</text>
<text x="40" y="68" font-size="13" fill="#78909C">Плата-носитель связывает покупные модули дорожками. Оранжевое — реле, бирюзовое — датчики, розовое — питание.</text>
<rect x="320" y="100" width="760" height="590" rx="14" fill="#F1F8E9" stroke="#2E7D32" stroke-width="3"/>
<text x="700" y="126" font-size="15" fill="#1B5E20" text-anchor="middle" font-weight="bold">ПЛАТА-НОСИТЕЛЬ 150×110 мм</text>
<text x="700" y="146" font-size="12" fill="#33691E" text-anchor="middle">модули вставляются в гнёзда; паяются только гнёзда, клеммники и мелочь</text>
<rect x="340" y="162" width="172" height="58" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2"/>
<text x="426" y="188" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">ESP32 DevKitC 38</text>
<text x="426" y="210" font-size="11" fill="#455A64" text-anchor="middle">гнездо 2×(1×19)</text>
<rect x="524" y="162" width="136" height="58" rx="8" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
<text x="593" y="188" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">PCF8574P</text>
<text x="593" y="210" font-size="11" fill="#455A64" text-anchor="middle">панелька DIP-16</text>
<rect x="673" y="162" width="136" height="58" rx="8" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
<text x="741" y="188" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">74HC4051</text>
<text x="741" y="210" font-size="11" fill="#455A64" text-anchor="middle">панелька DIP-16</text>
<rect x="821" y="162" width="102" height="58" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2"/>
<text x="872" y="188" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">DS3231</text>
<text x="872" y="210" font-size="11" fill="#455A64" text-anchor="middle">гнездо 1×6</text>
<rect x="935" y="162" width="164" height="58" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2"/>
<text x="1017" y="188" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">SD шилд D1 mini</text>
<text x="1017" y="210" font-size="11" fill="#455A64" text-anchor="middle">гнездо 2×(1×8)</text>
<rect x="340" y="242" width="170" height="58" rx="8" fill="#FCE4EC" stroke="#D81B60" stroke-width="2"/>
<text x="425" y="268" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">DC-DC 12→5 В</text>
<text x="425" y="290" font-size="11" fill="#455A64" text-anchor="middle">корпус TO-220, 3 pin</text>
<rect x="522" y="242" width="170" height="58" rx="8" fill="#FCE4EC" stroke="#D81B60" stroke-width="2"/>
<text x="607" y="268" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">DC-DC 5→3,3 В</text>
<text x="607" y="290" font-size="11" fill="#455A64" text-anchor="middle">корпус TO-220, 3 pin</text>
<rect x="704" y="242" width="146" height="58" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2"/>
<text x="778" y="268" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">Кнопка сброса</text>
<text x="778" y="290" font-size="11" fill="#455A64" text-anchor="middle">тактовая 6×6</text>
<rect x="863" y="242" width="279" height="58" rx="8" fill="#ECEFF1" stroke="#90A4AE" stroke-width="2"/>
<text x="1003" y="268" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">Защита входа</text>
<text x="1003" y="290" font-size="11" fill="#455A64" text-anchor="middle">F1 5 А · F2 3 А · MOSFET Q1 · TVS D2</text>
<rect x="340" y="322" width="720" height="57" rx="8" fill="#ECEFF1" stroke="#90A4AE" stroke-width="2"/>
<text x="700" y="347" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">Паяется на плату</text>
<text x="700" y="369" font-size="11" fill="#455A64" text-anchor="middle">держатели предохранителей, MOSFET, TVS, 6 конденсаторов, 11 резисторов, кнопка, штыри, гнёзда, панельки, клеммники</text>
<rect x="340" y="398" width="340" height="73" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
<text x="510" y="423" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">Клеммники 5,08 мм 2P ×5</text>
<text x="510" y="445" font-size="11" fill="#455A64" text-anchor="middle">12 В вход · 12 В на COM клапанов · 12 В насос</text>
<text x="510" y="461" font-size="11" fill="#455A64" text-anchor="middle">выносной фоторезистор · контакт датчика дождя</text>
<rect x="696" y="398" width="272" height="89" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
<text x="833" y="423" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">Клеммы к реле: своя на модуль</text>
<text x="833" y="445" font-size="11" fill="#455A64" text-anchor="middle">8 кан.: +5 В · GND · IN1…IN8</text>
<text x="833" y="461" font-size="11" fill="#455A64" text-anchor="middle">1 кан.: +5 В · GND · насос</text>
<text x="833" y="477" font-size="11" fill="#455A64" text-anchor="middle">2 кан.: +5 В · GND · налив · дренаж</text>
<rect x="340" y="503" width="720" height="73" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
<text x="700" y="528" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">Клеммники 5,08 мм 3P ×10</text>
<text x="700" y="550" font-size="11" fill="#455A64" text-anchor="middle">8 × датчик влажности (3V3 или 5V по JP1 · GND · AOUT)</text>
<text x="700" y="566" font-size="11" fill="#455A64" text-anchor="middle">расходомер · реле насоса</text>
<text x="700" y="674" font-size="13" fill="#1B5E20" text-anchor="middle" font-weight="bold">Ни одного провода «навесом»: все связи между модулями — дорожки платы</text>
<rect x="40" y="120" width="181" height="58" rx="8" fill="#FCE4EC" stroke="#D81B60" stroke-width="2"/>
<text x="130" y="146" font-size="14" font-weight="bold" fill="#263238" text-anchor="middle">Источник 12 В 5 А</text>
<text x="130" y="168" font-size="11" fill="#455A64" text-anchor="middle">на клеммник J1</text>
<path d="M221 149 L320 149" fill="none" stroke="#D81B60" stroke-width="4" marker-end="url(#arr)"/>
