<text x="149" y="393" font-size="11" fill="#455A64" text-anchor="middle">перемычки в положении L</text>
<rect x="40" y="440" width="254" height="73" rx="8" fill="#FFF3E0" stroke="#FB8C00" stroke-width="2"/>
<text x="167" y="465" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">Реле 1 + 2 кан. 5 В, H/L</text>
<text x="167" y="487" font-size="11" fill="#455A64" text-anchor="middle">насос · налив · дренаж</text>
<text x="167" y="503" font-size="11" fill="#455A64" text-anchor="middle">перемычки в положении H</text>
<path d="M736 442 L728 442 L728 495 L350 495 L350 366 L258 366" fill="none" stroke="#FB8C00" stroke-width="3"/>
<path d="M350 495 L350 476 L294 476" fill="none" stroke="#FB8C00" stroke-width="3"/>
<text x="44" y="425" font-size="11" fill="#E65100" text-anchor="start">провода к клеммам реле</text>
<rect x="1200" y="120" width="228" height="57" rx="8" fill="#E0F7FA" stroke="#00838F" stroke-width="2"/>
<text x="1314" y="145" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">Датчики влажности ×8</text>
<text x="1314" y="167" font-size="11" fill="#455A64" text-anchor="middle">ёмкостные v2.0, 3 провода</text>
<rect x="1200" y="210" width="290" height="73" rx="8" fill="#E0F7FA" stroke="#00838F" stroke-width="2"/>
<text x="1345" y="235" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">Дождь · Свет</text>
<text x="1345" y="257" font-size="11" fill="#455A64" text-anchor="middle">дождь — сухой контакт, как кнопка</text>
<text x="1345" y="273" font-size="11" fill="#455A64" text-anchor="middle">свет — выносной фоторезистор</text>
<rect x="1200" y="300" width="205" height="57" rx="8" fill="#E0F7FA" stroke="#00838F" stroke-width="2"/>
<text x="1302" y="325" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">Расходомер YF-S201</text>
<text x="1302" y="347" font-size="11" fill="#455A64" text-anchor="middle">5 В; делитель на плате</text>
<rect x="40" y="640" width="213" height="57" rx="8" fill="#F3E5F5" stroke="#8E24AA" stroke-width="2"/>
