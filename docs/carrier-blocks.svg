<text x="620" y="289" font-size="11" fill="#455A64" text-anchor="middle">TO-220</text>
<rect x="703" y="242" width="146" height="57" rx="8" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2"/>
<text x="776" y="267" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">Кнопка сброса</text>
<text x="776" y="289" font-size="11" fill="#455A64" text-anchor="middle">6×6</text>
<rect x="859" y="242" width="166" height="57" rx="8" fill="#ECEFF1" stroke="#90A4AE" stroke-width="2"/>
<text x="943" y="267" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">Защита входа</text>
<text x="943" y="289" font-size="11" fill="#455A64" text-anchor="middle">F1 · F2 · Q1 · TVS</text>
<rect x="400" y="322" width="720" height="57" rx="8" fill="#ECEFF1" stroke="#90A4AE" stroke-width="2"/>
<text x="760" y="347" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">Паяется на плату</text>
<text x="760" y="369" font-size="11" fill="#455A64" text-anchor="middle">держатели F1/F2, MOSFET, TVS, 6 конденсаторов, 11 резисторов, кнопка, штыри, гнёзда, панельки, клеммники</text>
<rect x="400" y="398" width="320" height="73" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
<text x="560" y="423" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">Клеммники 5,08 мм 2P ×5</text>
<text x="560" y="445" font-size="11" fill="#455A64" text-anchor="middle">12 В вход · 12 В клапаны · 12 В насос</text>
<text x="560" y="461" font-size="11" fill="#455A64" text-anchor="middle">фоторезистор · датчик дождя</text>
<rect x="736" y="398" width="305" height="89" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
<text x="889" y="423" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">Клеммы к реле: своя на модуль</text>
<text x="889" y="445" font-size="11" fill="#455A64" text-anchor="middle">8 кан.: +5 В · GND · IN1…IN8</text>
<text x="889" y="461" font-size="11" fill="#455A64" text-anchor="middle">1 кан.: +5 В · GND · насос</text>
<text x="889" y="477" font-size="11" fill="#455A64" text-anchor="middle">2 кан.: +5 В · GND · налив · дренаж</text>
<rect x="400" y="503" width="720" height="73" rx="8" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
<text x="760" y="528" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">Клеммники 5,08 мм 3P ×10</text>
<text x="760" y="550" font-size="11" fill="#455A64" text-anchor="middle">8 × датчик влажности (3V3/5V по JP1 · GND · AOUT)</text>
<text x="760" y="566" font-size="11" fill="#455A64" text-anchor="middle">расходомер · реле насоса</text>
<text x="760" y="674" font-size="13" fill="#1B5E20" text-anchor="middle" font-weight="bold">Ни одного провода «навесом»: все связи между модулями — дорожки платы</text>
<rect x="40" y="120" width="190" height="57" rx="8" fill="#FCE4EC" stroke="#D81B60" stroke-width="2"/>
<text x="135" y="145" font-size="13" font-weight="bold" fill="#263238" text-anchor="middle">Источник 12 В 5 А</text>
<text x="135" y="167" font-size="11" fill="#455A64" text-anchor="middle">на клеммник J1</text>
