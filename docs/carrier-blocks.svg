<text x="146" y="687" font-size="11" fill="#455A64" text-anchor="middle">на контакты реле 8 кан.</text>
<rect x="40" y="720" width="281" height="57" rx="8" fill="#F3E5F5" stroke="#8E24AA" stroke-width="2"/>
